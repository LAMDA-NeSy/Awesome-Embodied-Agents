name: Add a paper
description: Suggest a paper about code agents or embodied harnesses in games or robotics
title: "[Add] "
body:
  - type: markdown
    attributes:
      value: "Please check for duplicates and read CONTRIBUTING.md. Paper tables use Paper, Venue, Task, and Links. Link the paper through its title; Links contains only Code and Project Page."
  - type: input
    id: paper_title
    attributes:
      label: Paper
      description: Official full title. This becomes the clickable Paper cell.
      placeholder: Full title
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Survey
        - Harness
        - Model Training
        - Benchmark
    validations:
      required: true
  - type: input
    id: venue
    attributes:
      label: Venue
      description: Give the formal venue or use Arxiv for a preprint. The month appears on a separate line in the table.
      placeholder: ICML or Arxiv
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: Task
      description: Capitalize each word in game names or concrete robot tasks and separate multiple tasks with semicolons.
      placeholder: Minecraft; Object Manipulation; Indoor Navigation
    validations:
      required: true
  - type: input
    id: paper_url
    attributes:
      label: Paper link
      description: Primary-source URL linked from the paper title.
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: input
    id: code_url
    attributes:
      label: Official code link
      placeholder: https://github.com/...
  - type: input
    id: project_url
    attributes:
      label: Project page link
      placeholder: https://...
  - type: input
    id: first_release
    attributes:
      label: Venue month
      description: Use the conference or journal publication month for published papers and the first public preprint month for preprints.
      placeholder: YYYY-MM
  - type: textarea
    id: relevance
    attributes:
      label: Scope and category evidence
      description: For Harness methods, describe the runtime, code/tool/skill/action interface, feedback, and embodied task. Distinguish custom frameworks from general-purpose coding agents. For Model Training, identify the trained agent model, objective, and deployment output interface. For surveys, explain the system-level scope. For benchmarks, identify the measured ability and tested interface. Link primary-source evidence.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional reading-note details
      description: Optionally record the coding-agent setup, model, interface, feedback, or learning process.
