name: Add a paper
description: Suggest a paper about code agents or embodied harnesses in games or robotics
title: "[Add] "
body:
  - type: markdown
    attributes:
      value: "Please check for duplicates and read CONTRIBUTING.md. Paper tables use Paper, Venue, Task, and Links. Link the paper through its title; Links contains only Code and Project Page."
  - type: input
    id: paper_title
    attributes:
      label: Paper
      description: Full paper title; this becomes the clickable Paper cell in the table.
      placeholder: Full title
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Survey
        - Harness
        - Model Training
        - Benchmark
    validations:
      required: true
  - type: input
    id: venue
    attributes:
      label: Venue
      description: Use Arxiv YYYY-MM for the v1 month. For published papers, retain the verified venue and edition year above it using <br>.
      placeholder: ICML 2024<br>Arxiv 2024-02, or Arxiv 2026-11
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: Task
      description: Use game names or concrete robot tasks; separate multiple tasks with semicolons.
      placeholder: Minecraft; Manipulation; Navigation
    validations:
      required: true
  - type: input
    id: paper_url
    attributes:
      label: Paper link
      description: Primary-source URL linked from the paper title.
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: input
    id: code_url
    attributes:
      label: Official code link
      placeholder: https://github.com/...
  - type: input
    id: project_url
    attributes:
      label: Project page link
      placeholder: https://...
  - type: input
    id: first_release
    attributes:
      label: First paper release month
      description: Use Arxiv v1 when available, otherwise the first official release. Sort months newest first and same-month full titles alphabetically, ignoring case; the table still has four columns.
      placeholder: YYYY-MM; Arxiv v1 when applicable
  - type: textarea
    id: relevance
    attributes:
      label: Scope and category evidence
      description: For Harness methods, describe the runtime, code/tool/skill/action interface, feedback, and embodied task. Distinguish custom frameworks from general-purpose coding agents. For Model Training, identify the trained agent model, objective, and deployment output interface. For surveys, explain the system-level scope. For benchmarks, identify the measured ability and tested interface. Link primary-source evidence.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional reading-note details
      description: Optionally record the coding-agent setup, model, interface, feedback, or learning process.
