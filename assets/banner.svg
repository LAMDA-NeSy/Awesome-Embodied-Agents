    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a8e6d4" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1440" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="420" rx="24" fill="url(#grid)"/>
