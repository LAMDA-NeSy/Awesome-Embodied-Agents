<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Embodied Agents</title>
  <desc id="desc">An illustrated research collection connecting perception, reasoning, memory, planning, action, and learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b2a"/>
      <stop offset="1" stop-color="#153c42"/>
