<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="780" viewBox="0 0 1680 780" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Embodied Code Agents</title>
  <desc id="desc">An embodied agent architecture: a foundation model interacts with a harness for perception, context, planning, memory, code execution, tools, and verification. Shared action interfaces connect the agent to game and robot environments, which return observations and feedback.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfa"/><stop offset="1" stop-color="#edf5f1"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#9ab7aa" opacity=".22"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.145 0 0 0 0 0.306 0 0 0 0 0.263 0 0 0 0.06 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#5e9787"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M9 1L1 5L9 9Z" fill="#5e9787"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#6f9db2"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#bb945c"/>
    </marker>

    <g id="eye" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12Q12-1 23 12Q12 25 1 12Z"/><circle cx="12" cy="12" r="3.7"/>
    </g>
    <g id="plan" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="1" width="8" height="6" rx="1.5"/><path d="M12 7V12M4 16V12H20V16"/>
      <rect x="0" y="16" width="8" height="6" rx="1.5"/><rect x="16" y="16" width="8" height="6" rx="1.5"/>
    </g>
    <g id="memory" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="4" rx="10" ry="3.5"/><path d="M2 4V19C2 24 22 24 22 19V4M2 11C2 16 22 16 22 11"/>
    </g>
    <g id="check" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1L22 5V13Q22 20 12 24Q2 20 2 13V5Z"/><path d="M6 12L10 16L18 8"/>
    </g>
    <g id="terminal" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="29" height="23" rx="4"/><path d="M6 7L11 11.5L6 16M16 16H23"/>
    </g>
  </defs>

  <rect width="1680" height="780" rx="28" fill="url(#background)"/>
  <rect x="32" y="140" width="1616" height="500" rx="28" fill="url(#dots)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- A compact title leaves the architecture as the main visual. -->
    <text x="64" y="76" fill="#193f35" font-size="43" font-weight="700" letter-spacing="-1.4">Awesome Embodied Code Agents</text>
    <text x="66" y="113" fill="#6a8477" font-size="18">Models and harnesses for agents in games and robotics.</text>
    <rect x="1280" y="47" width="334" height="37" rx="18.5" fill="#e2eee7"/>
    <circle cx="1302" cy="65.5" r="4" fill="#5f9780"/>
    <text x="1320" y="70" fill="#4d7562" font-size="11" font-weight="700" letter-spacing="1.5">MODEL + HARNESS + ENVIRONMENT</text>

    <!-- A common observation path returns information from both worlds. -->
    <g fill="none" stroke="#6f9db2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1616 524H1628Q1642 524 1642 510V200Q1642 185 1627 185H915Q900 185 900 200V217" marker-end="url(#arrow-blue)"/>
      <path d="M1616 308H1642"/>
    </g>
    <rect x="1078" y="168" width="362" height="32" rx="16" fill="#f3f8f7"/>
    <text x="1259" y="189" text-anchor="middle" fill="#63879c" font-size="12" font-weight="700" letter-spacing=".8">OBSERVATIONS / STATE / FEEDBACK</text>

    <!-- Task input is independent of world observations. -->
    <g transform="translate(442 155)">
      <rect width="244" height="44" rx="13" fill="#ffffff" stroke="#cbded2"/>
      <path d="M21 12H36V31H21ZM25 17H32M25 22H32M25 27H29" fill="none" stroke="#769180" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="53" y="28" fill="#4e7060" font-size="14" font-weight="600">Task / Instruction</text>
    </g>
    <path d="M564 200V217" fill="none" stroke="#5e9787" stroke-width="2" marker-end="url(#arrow-teal)"/>

    <!-- The agent contains two distinct, interacting components. -->
    <rect x="64" y="224" width="1016" height="394" rx="25" fill="#ffffff" stroke="#c5d9ce" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="91" cy="256" r="4" fill="#568c74"/>
    <text x="106" y="261" fill="#4e7461" font-size="12" font-weight="700" letter-spacing="1.9">EMBODIED AGENT</text>
    <text x="1054" y="261" text-anchor="end" fill="#8a9d91" font-size="12">Reason · Program · Interact</text>

    <!-- Foundation model: the learned reasoning and generation component. -->
    <g transform="translate(88 292)">
      <rect width="260" height="278" rx="19" fill="#f2f0f9" stroke="#d4cfe5"/>
      <text x="20" y="30" fill="#8a7aa5" font-size="11" font-weight="700" letter-spacing="1.6">MODEL</text>
      <g transform="translate(75 60)" fill="none" stroke="#8f83ad" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-8 15H0M-8 29H0M-8 43H0M-8 57H0M110 15H118M110 29H118M110 43H118M110 57H118M25-8V0M40-8V0M55-8V0M70-8V0M85-8V0M25 72V80M40 72V80M55 72V80M70 72V80M85 72V80"/>
        <rect width="110" height="72" rx="14" fill="#ffffff"/>
        <path d="M55 20Q44 7 33 19Q18 18 20 33Q10 45 24 51Q27 65 43 58L55 52M55 20Q66 7 77 19Q92 18 90 33Q100 45 86 51Q83 65 67 58L55 52M55 20V52M33 20L38 31L29 39M77 20L72 31L81 39M24 51L37 44L44 48M86 51L73 44L66 48"/>
        <circle cx="38" cy="31" r="2.5" fill="#8f83ad"/><circle cx="72" cy="31" r="2.5" fill="#8f83ad"/>
      </g>
      <text x="130" y="181" text-anchor="middle" fill="#55496c" font-size="23" font-weight="700" letter-spacing="-.5">Foundation Model</text>
      <text x="130" y="207" text-anchor="middle" fill="#8b7d9e" font-size="13">Reasoning · Code · Actions</text>
      <rect x="72" y="230" width="116" height="29" rx="14.5" fill="#e6e0f2"/>
      <path d="M90 245L94 241L98 245M94 241V250" fill="none" stroke="#8c7aa8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="112" y="249" fill="#84739d" font-size="11" font-weight="700" letter-spacing=".8">SFT / RL</text>
    </g>

    <!-- Harness modules surround the code execution and verification loop. -->
    <g transform="translate(376 292)">
      <rect width="678" height="278" rx="19" fill="#f6f9f6" stroke="#d1dfd5"/>
      <text x="24" y="35" fill="#3e6855" font-size="25" font-weight="700" letter-spacing="-.4">Harness</text>
      <text x="651" y="33" text-anchor="end" fill="#85998b" font-size="12">Tools, context &amp; execution</text>

      <g transform="translate(24 56)">
        <rect width="192" height="78" rx="12" fill="#edf4fa" stroke="#c7dce9"/>
        <use href="#eye" x="15" y="20" color="#6e98b3"/>
        <text x="50" y="29" fill="#4b728d" font-size="17" font-weight="700">Perception</text>
        <text x="16" y="59" fill="#7d97a7" font-size="12">Context · Observations</text>
      </g>
      <g transform="translate(230 56)">
        <rect width="192" height="78" rx="12" fill="#edf5ed" stroke="#c9dec7"/>
        <use href="#plan" x="15" y="20" color="#78a076"/>
        <text x="50" y="29" fill="#557b53" font-size="17" font-weight="700">Planning</text>
        <text x="16" y="59" fill="#82977b" font-size="12">Goals · Tasks · Decisions</text>
      </g>
      <g transform="translate(436 56)">
        <rect width="218" height="78" rx="12" fill="#f3eff9" stroke="#dcd0e9"/>
        <use href="#memory" x="15" y="19" color="#a18ab8"/>
        <text x="50" y="29" fill="#806a97" font-size="17" font-weight="700">Memory</text>
        <text x="16" y="59" fill="#9a88ad" font-size="12">History · Reusable skills</text>
      </g>

      <g transform="translate(24 151)">
        <rect width="398" height="102" rx="12" fill="#e9f5f1" stroke="#bcdcd1"/>
        <use href="#terminal" x="16" y="19" color="#5e9786"/>
        <text x="58" y="37" fill="#3c7965" font-size="18" font-weight="700">Code Runtime &amp; Tools</text>
        <text x="17" y="67" fill="#729485" font-family="Menlo, Consolas, monospace" font-size="12">Python / APIs / Sandbox / Skills</text>
        <text x="17" y="88" fill="#729485" font-size="12">Write · Execute · Inspect · Repair</text>
      </g>
      <g transform="translate(436 151)">
        <rect width="218" height="102" rx="12" fill="#fbf4e9" stroke="#e8d7ba"/>
        <use href="#check" x="17" y="20" color="#b79a68"/>
        <text x="53" y="38" fill="#92774e" font-size="18" font-weight="700">Verifier</text>
        <text x="17" y="68" fill="#aa9575" font-size="12">Test · Monitor · Recover</text>
        <text x="17" y="88" fill="#aa9575" font-size="12">Success &amp; execution feedback</text>
      </g>
    </g>
    <path d="M350 428H374" fill="none" stroke="#5e9787" stroke-width="2" marker-start="url(#arrow-back)" marker-end="url(#arrow-teal)"/>
    <text x="88" y="598" fill="#81978a" font-size="12">A learned model and an execution harness form the agent together.</text>

    <!-- Shared actions fan out to either embodiment. -->
    <path d="M1054 485H1112" fill="none" stroke="#bb945c" stroke-width="2.3" marker-end="url(#arrow-gold)"/>
    <g transform="translate(1120 448)">
      <rect width="104" height="74" rx="14" fill="#fffaf1" stroke="#e2ceb0"/>
      <path d="M31 20H70M62 13L70 20L62 27" fill="none" stroke="#b89a70" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="47" text-anchor="middle" fill="#9a7c50" font-size="15" font-weight="700">Actions</text>
      <text x="52" y="63" text-anchor="middle" fill="#b09b7c" font-size="10">APIs / SDKs</text>
    </g>
    <g fill="none" stroke="#bb945c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1224 485H1246V320Q1246 308 1258 308H1263" marker-end="url(#arrow-gold)"/>
      <path d="M1246 485V512Q1246 524 1258 524H1263" marker-end="url(#arrow-gold)"/>
    </g>
    <circle cx="1246" cy="485" r="3.5" fill="#bb945c"/>

    <!-- Game world: a player and goal on a small block-world landscape. -->
    <g transform="translate(1270 214)">
      <rect width="346" height="188" rx="20" fill="#ffffff" stroke="#d0ddce" stroke-width="1.3" filter="url(#shadow)"/>
      <text x="20" y="32" fill="#52735b" font-size="22" font-weight="700">Game</text>
      <text x="94" y="31" fill="#9aaa96" font-size="12">ENVIRONMENT</text>
      <g transform="translate(295 12)" fill="none" stroke="#8a9e7c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 5H23Q27 5 29 12L31 24Q31 28 27 26L21 21H9L3 26Q-1 28 0 23L2 12Q3 5 6 5Z" fill="#f2f6e9"/>
        <path d="M8 10V17M4.5 13.5H11.5"/><circle cx="22" cy="11" r="1.2"/><circle cx="25" cy="16" r="1.2"/>
      </g>
      <rect x="16" y="48" width="314" height="108" rx="10" fill="#eef5f7"/>
      <path d="M33 78H49V69H70V77H85V84H33Z" fill="#ffffff"/>
      <path d="M236 65H245V58H266V65H280V72H236Z" fill="#ffffff"/>
      <path d="M176 111L201 72L231 111M213 111L248 82L275 111" fill="#d3e0e5"/>
      <path d="M189 91L201 72L215 91L203 86Z" fill="#ffffff" opacity=".8"/>
      <path d="M17 132H36V118H59V129H86V108H112V126H148V117H180V131H211V114H239V127H266V118H304V130H330V156H16Z" fill="#dae8de"/>
      <path d="M65 117L155 87L282 120L192 150Z" fill="#b0cfa2"/>
      <path d="M65 117V131L134 156H192V150Z" fill="#baa47f"/>
      <path d="M192 150L282 120V134L219 156H192Z" fill="#9d8a69"/>
      <path d="M95 107L222 140M125 97L252 130M107 128L197 98M149 139L239 109" fill="none" stroke="#96b988" stroke-width="1.1"/>
      <path d="M209 110V80L232 88L209 96" fill="#e7bf7c" stroke="#a78c60" stroke-width="1.5" stroke-linejoin="round"/>
      <ellipse cx="142" cy="123" rx="13" ry="4" fill="#8faf84"/>
      <path d="M133 96H149V112H133Z" fill="#6295a0"/><path d="M133 81H149V97H133Z" fill="#f2d1a0"/>
      <path d="M133 81H149V86H133Z" fill="#7b6850"/>
      <path d="M135 112V123M147 112V123" stroke="#597982" stroke-width="5"/>
      <path d="M133 100H127V110M149 100H155V110" fill="none" stroke="#6295a0" stroke-width="4"/>
      <circle cx="144" cy="90" r="1.2" fill="#7b6850"/>
      <text x="20" y="177" fill="#889a7d" font-size="12">Open worlds · Strategy · Puzzles</text>
    </g>

    <!-- Robot world: articulated control and an object-centered workspace. -->
    <g transform="translate(1270 430)">
      <rect width="346" height="188" rx="20" fill="#ffffff" stroke="#c8dcd7" stroke-width="1.3" filter="url(#shadow)"/>
      <text x="20" y="32" fill="#4d7770" font-size="22" font-weight="700">Robot</text>
      <text x="99" y="31" fill="#8fa8a0" font-size="12">ENVIRONMENT</text>
      <g transform="translate(297 12)" fill="#eef5f2" stroke="#7b9f91" stroke-width="1.5" stroke-linecap="round">
        <rect x="0" y="7" width="29" height="21" rx="6"/><path d="M14.5 7V2M-3 15V22M32 15V22"/>
        <circle cx="14.5" cy="0" r="2" fill="#7b9f91"/><circle cx="9" cy="17" r="2" fill="#7b9f91" stroke="none"/><circle cx="20" cy="17" r="2" fill="#7b9f91" stroke="none"/>
      </g>
      <rect x="16" y="48" width="314" height="108" rx="10" fill="#f0f5f1"/>
      <path d="M28 129H317M44 151L104 107M111 151L149 107M178 151L194 107M245 151L239 107M312 151L284 107" stroke="#d7e4dc" stroke-width="1"/>
      <ellipse cx="139" cy="137" rx="37" ry="7" fill="#d1e1d6"/>
      <path d="M109 132H162L169 143H102Z" fill="#6c9480"/>
      <path d="M135 132V110L91 86L128 63H183" fill="none" stroke="#739c87" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M135 132V110L91 86L128 63H183" fill="none" stroke="#bdd6c6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#f8fcf8" stroke="#608572" stroke-width="3">
        <circle cx="135" cy="110" r="8"/><circle cx="91" cy="86" r="8"/><circle cx="128" cy="63" r="8"/>
      </g>
      <rect x="178" y="56" width="14" height="15" rx="3" fill="#5e8471"/>
      <path d="M185 71V81M185 81L173 88V97M185 81L197 88V97" fill="none" stroke="#5e8471" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M230 116L251 104L273 116L251 129Z" fill="#f1c993"/>
      <path d="M230 116V137L251 150V129Z" fill="#d8ad7b"/>
      <path d="M251 129L273 116V137L251 150Z" fill="#b98e60"/>
      <path d="M198 113Q215 93 237 103" fill="none" stroke="#bdab89" stroke-width="1.5" stroke-dasharray="3 4"/>
      <text x="20" y="177" fill="#839c8e" font-size="12">Manipulation · Navigation · Control</text>
    </g>

    <!-- Collection navigation stays secondary to the architectural logo. -->
    <path d="M64 662H1616" stroke="#d9e5dc" stroke-width="1"/>
    <text x="66" y="697" fill="#557867" font-size="17" font-weight="600">Shared agent architecture. Game and robot worlds.</text>
    <g fill="#ffffff" stroke="#d5e2d8">
      <rect x="65" y="720" width="108" height="32" rx="10"/><rect x="185" y="720" width="132" height="32" rx="10"/>
      <rect x="329" y="720" width="166" height="32" rx="10"/><rect x="507" y="720" width="111" height="32" rx="10"/>
    </g>
    <g fill="#789280" font-size="11" font-weight="600" text-anchor="middle" letter-spacing=".4">
      <text x="119" y="741">Survey</text><text x="251" y="741">Benchmark</text><text x="412" y="741">Model Training</text><text x="562.5" y="741">Harness</text>
    </g>
    <text x="1614" y="741" text-anchor="end" fill="#90a296" font-size="12">Observe / Reason / Code / Act / Learn</text>
  </g>
</svg>
